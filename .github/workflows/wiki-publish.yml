name: Wiki Documentation

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      adopt_existing_pages:
        description: Adopt unmanaged Wiki.js pages whose locale and path match repository pages
        required: true
        type: boolean
        default: false
      allow_mass_delete:
        description: Allow deletion beyond the normal managed-page safety limit
        required: true
        type: boolean
        default: false
      dry_run:
        description: Calculate and print changes without modifying Wiki.js
        required: true
        type: boolean
        default: true

concurrency:
  group: baudbound-wiki-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout editor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: BaudBound/editor
          ref: master
          path: .sources/editor
          persist-credentials: false

      - name: Checkout runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: BaudBound/baudbound
          ref: master
          path: .sources/baudbound
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: publisher/pnpm-lock.yaml

      - name: Install publisher dependencies
        run: pnpm --dir publisher install --frozen-lockfile

      - name: Test publisher safety contracts
        run: pnpm --dir publisher test

      - name: Validate public documentation
        env:
          WIKI_EDITOR_SOURCE_ROOT: .sources/editor
          WIKI_RUNNER_SOURCE_ROOT: .sources/baudbound
        run: pnpm --dir publisher validate

  publish:
    name: Publish to Wiki.js
    needs: validate
    if: >-
      github.repository == 'BaudBound/documentation' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: wiki-production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout editor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: BaudBound/editor
          ref: master
          path: .sources/editor
          persist-credentials: false

      - name: Checkout runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: BaudBound/baudbound
          ref: master
          path: .sources/baudbound
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: publisher/pnpm-lock.yaml

      - name: Install publisher dependencies
        run: pnpm --dir publisher install --frozen-lockfile

      - name: Reconcile Wiki.js pages
        env:
          WIKI_ALLOW_ADOPT: ${{ inputs.adopt_existing_pages || 'false' }}
          WIKI_ALLOW_MASS_DELETE: ${{ inputs.allow_mass_delete || 'false' }}
          WIKI_API_TOKEN: ${{ secrets.WIKI_API_TOKEN }}
          WIKI_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          WIKI_EDITOR_SOURCE_ROOT: .sources/editor
          WIKI_RUNNER_SOURCE_ROOT: .sources/baudbound
          WIKI_URL: ${{ secrets.WIKI_URL }}
        run: pnpm --dir publisher run publish
